<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>だいどこ — 今夜</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sur:#f4f4f2;--line:#e6e6e2;--ink:#151515;--sub:#6f6f6b;--mute:#a3a39e;--acc:#e8532e;--acc-soft:#fdeee9}
*{box-sizing:border-box}html,body{margin:0}
body{width:390px;min-height:844px;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-feature-settings:"tnum";letter-spacing:.005em;line-height:1.5;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.top{padding:44px 20px 0}
.date{font-size:13px;color:var(--sub);font-weight:500}
h1{margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.week{display:flex;justify-content:space-between;margin:12px 20px 0}
.day{width:40px;text-align:center;font-size:11px;color:var(--mute)}
.day b{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-top:2px;line-height:30px;height:30px;border-radius:15px}
.day i{display:block;width:4px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.day.on b{background:var(--ink);color:#fff}.day.done i{background:var(--acc)}
.hero{margin:12px 20px 0;border-radius:20px;overflow:hidden;background:var(--sur);position:relative}
.hero img{display:block;width:100%;height:150px;object-fit:cover}
.hero .body{padding:12px 16px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.chip.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.hero h2{margin:8px 0 2px;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.hero .set{font-size:13px;color:var(--sub)}
.hero .set b{color:var(--ink);font-weight:500}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;font-size:14px;font-weight:600;padding:10px 0;border-radius:12px;background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);flex:0 0 112px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 20px 8px}
.sec h3{margin:0;font-size:15px;font-weight:700}.sec a{font-size:13px;color:var(--sub)}
.alts{display:flex;gap:10px;padding:0 20px}
.alt{flex:1;border-radius:16px;overflow:hidden;background:var(--sur)}
.alt img{display:block;width:100%;height:66px;object-fit:cover}
.alt .b{padding:7px 11px 9px}
.alt .t{font-size:11px;font-weight:600;color:var(--acc)}
.alt h4{margin:2px 0 0;font-size:13px;font-weight:600;line-height:1.35}
.shop{margin:12px 20px 0;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.shop svg{flex:0 0 22px}
.shop .k{font-size:14px;font-weight:600}.shop .v{font-size:12px;color:var(--sub);margin-top:1px}
.shop .chev{margin-left:auto;color:var(--mute);font-size:20px}
.note{margin:10px 20px 0;display:flex;align-items:center;gap:10px;background:var(--sur);border-radius:999px;padding:11px 16px;font-size:13px;color:var(--mute)}
.note svg{flex:0 0 18px}
.tab{position:absolute;left:0;right:0;bottom:0;height:82px;padding-bottom:18px;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-around;align-items:center}
.tab div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--mute);width:64px}
.tab div.on{color:var(--ink)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sample{position:absolute;right:20px;top:34px;font-size:10px;color:var(--mute)}
</style></head><body>
<span class="sample">サンプル表示</span>
<div class="top"><div class="date">9月12日 土曜日</div><h1>今夜のこんだて</h1></div>
<div class="week">
 <div class="day done">月<b>7</b><i></i></div><div class="day done">火<b>8</b><i></i></div><div class="day done">水<b>9</b><i></i></div><div class="day done">木<b>10</b><i></i></div><div class="day done">金<b>11</b><i></i></div><div class="day on">土<b>12</b><i></i></div><div class="day">日<b>13</b><i></i></div>
</div>
<div class="hero"><img src="photo-pork.png" alt=""><div class="body">
 <div class="chips"><span class="chip acc">15分</span><span class="chip">主菜</span><span class="chip">2人前</span><span class="chip">きのうと違う味</span></div>
 <h2>豚こまと小松菜の生姜炒め</h2>
 <div class="set">副菜 <b>きゅうりの塩もみ</b>　汁物 <b>豆腐とわかめの味噌汁</b></div>
 <div class="row"><div class="btn">これにする</div><div class="btn ghost">作り方</div></div>
</div></div>
<div class="sec"><h3>ほかの案</h3><a>もう3つ見る</a></div>
<div class="alts">
 <div class="alt"><img src="photo-salmon.png" alt=""><div class="b"><div class="t">30分</div><h4>鮭のホイル焼き きのこバター</h4></div></div>
 <div class="alt"><img src="photo-hamburg.png" alt=""><div class="b"><div class="t">50分 · 週末向き</div><h4>手ごねハンバーグ</h4></div></div>
</div>
<div class="shop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg><div><div class="k">買い出し 4点</div><div class="v">豚こま・小松菜・生姜・豆腐　スーパー（登録待ち）</div></div><span class="chev">›</span></div>
<div class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a39e" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg>「鶏むねが余ってる」など、ひとこと残す</div>
<nav class="tab">
 <div class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>今夜</div>
 <div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>こんだて表</div>
 <div><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>買い物</div>
 <div><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>台帳</div>
</nav>
</body></html>
